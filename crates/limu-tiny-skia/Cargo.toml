[package]
name = "limu-tiny-skia"
description = "Draws limu's scenes into tiny-skia pixmaps, with text shaped by rustybuzz."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["mermaid", "diagram", "tiny-skia", "png"]
categories = ["visualization", "rendering"]
# The golden images are the tests', which a host never runs.
exclude = ["tests/golden"]

[dependencies]
limu-scene = { workspace = true }
rustybuzz = "0.20"
tiny-skia = "0.12"

[dev-dependencies]
limu = { path = "../limu" }
limu-fixtures = { path = "../limu-fixtures" }
limu-samples = { path = "../limu-samples" }

[lints]
workspace = true
