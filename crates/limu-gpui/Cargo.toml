[package]
name = "limu-gpui"
description = "Draws limu's scenes in GPUI windows, measuring text with GPUI's text system."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/firede/limu-rs"
authors = ["Firede <firede@firede.com>"]
homepage = "https://limu.firede.com"
readme = "../../README.md"
keywords = ["mermaid", "diagram", "gpui"]
categories = ["visualization", "gui"]
# The golden images are the tests', which a host never runs.
exclude = ["tests/golden"]

# A workspace of its own: GPUI takes long to build, and the root workspace's checks leave it
# out. CI builds it in a job of its own.
[workspace]

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.12" }
limu-scene = { path = "../limu-scene", version = "0.1.0" }
# The caps and joins of a stroke, in the version GPUI tessellates with.
lyon = "1.0"

[dev-dependencies]
# Without font-kit, GPUI on macOS has no text system and sets no glyphs.
gpui_platform = { package = "gpui-fast-platform", version = "0.1.12", features = ["font-kit"] }
# The frames of the sample image, in the version GPUI's images are made of.
image = { version = "0.25.1", default-features = false }
limu-samples = { path = "../limu-samples" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
neg_cmp_op_on_partial_ord = "allow"
