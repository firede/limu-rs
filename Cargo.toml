[workspace]
members = ["crates/limu-scene", "crates/limu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/firede/limu-rs"
authors = ["Firede <firede@firede.com>"]

[workspace.dependencies]
limu-scene = { path = "crates/limu-scene", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
